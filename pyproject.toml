[project]
name = "strands-decider-2b-onnx-cpu"
version = "0.1.0"
description = "Strands Decider 2B (typed decisions, text and images) with onnxruntime + numpy only: no torch, no transformers. CPU, and GPU when onnxruntime-gpu is installed"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Runtime. That is the whole list. pillow is only imported when a request carries images.
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# GPU (CUDA 13 + cuDNN 9 on PATH). onnxruntime-gpu and onnxruntime write into the same onnxruntime/ folder and must not be
# installed together: after `uv sync --extra gpu` run
#   uv pip install --force-reinstall --no-deps onnxruntime-gpu
# and use `uv run --no-sync` afterwards (a plain `uv run` puts the CPU build back). See the README.
gpu = [
    "onnxruntime-gpu>=1.20",
]

[dependency-groups]
# Only for the oracle gates in verify/check_tokenizer_fuzz.py and check_combining.py. Never imported at runtime.
verify = [
    "tokenizers>=0.20",
]
# Only for tests/. The tests need no model.
test = [
    "pytest>=8",
]
# Only for demo_inference_webcam.py (camera capture and the live window). Never imported by strands_decide.
webcam = [
    "opencv-python>=4.8",
]
# Only for export/ and the oracle gates in verify/ that need the reference model. Never imported at runtime.
# strands-decider is the reference engine for export/make_golden.py (make_golden_image.py needs the code repository's main,
# see its docstring: 0.1.0 on PyPI has no image path).
export = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.18",
    "onnx>=1.17",
    "onnxscript>=0.1",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "tokenizers>=0.20",
    "strands-decider>=0.1.0",
]

# `uv sync` installs the code in this checkout (strands_decide) so that
#   uv pip install git+https://github.com/Kazuhito00/Strands-Decider-2B-ONNX-CPU
# gives `import strands_decide` too. The demos also run straight from the checkout (`uv run demo_inference_text.py`).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strands_decide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
